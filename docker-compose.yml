services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: worklifebalance
      POSTGRES_USER: wlb
      POSTGRES_PASSWORD: wlb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: worklifebalance
      PGUSER: wlb
      PGPASSWORD: wlb
    depends_on:
      - postgres

volumes:
  postgres_data:
